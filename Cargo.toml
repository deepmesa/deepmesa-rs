[package]
name = "deepmesa"
version = "0.10.0"
authors = ["Rahul Singh <rsingh@arrsingh.com>"]
edition = "2018"
categories = [
	"data-structures",
]

license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/deepmesa/deepmesa-rs"
homepage = "https://www.deepmesa.com"
documentation = "https://docs.rs/deepmesa"
description = "This crate provides fast Data Structures and Algorithms in Rust. Every data structure is hand crafted for performance, well tested and has an extensive API."

[dependencies]
deepmesa-collections = {path = "./deepmesa-collections", version = "^0.10.0" }
deepmesa-encoding = {path = "./deepmesa-encoding", version = "^0.10.0" }
deepmesa-common = {path = "./deepmesa-common", version = "^0.10.0" }
deepmesa-stats = {path = "./deepmesa-stats", version = "^0.10.0" }

[workspace]
members = [
    ".",
    "deepmesa-encoding",
    "deepmesa-collections",
    "deepmesa-common",
    "deepmesa-stats",
]
